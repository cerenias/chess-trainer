<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --panel2: #0d1b38;
  --gold: #d4af37;
  --text: #e8e4da;
  --dim: #8a8699;
  --green: #27ae60;
  --blue: #2980b9;
  --red: #c0392b;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Source Serif 4', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--panel);
  border-bottom: 1px solid rgba(212,175,55,.25);
  flex-shrink: 0;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.35rem;
  color: var(--gold);
}
.hdr-btns { display: flex; gap: 8px; }

/* ── Buttons ── */
.btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,.2);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Source Serif 4', serif;
  font-size: .85rem;
  transition: background .15s;
  white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-gold { border-color: var(--gold); color: var(--gold); }
.btn-gold:hover { background: rgba(212,175,55,.12); }

/* ── API key bar ── */
#api-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 24px;
  background: var(--panel2);
  border-bottom: 1px solid rgba(255,255,255,.07);
  font-size: .83rem;
  flex-shrink: 0;
}
#api-bar label { color: var(--dim); white-space: nowrap; }
#api-key-input {
  flex: 1;
  max-width: 380px;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.18);
  color: var(--text);
  padding: 5px 10px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: .78rem;
}
#api-key-input:focus { outline: none; border-color: var(--gold); }
#key-status { font-size: .78rem; color: var(--dim); }

/* ── Main layout ── */
#main {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── Board section ── */
#board-section {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 10px;
  min-width: 0;
}
#board-area {
  display: flex;
  align-items: stretch;
  gap: 10px;
}
#board-wrap {
  position: relative;
  width: min(72vh, 480px, calc(100vw - 360px));
  aspect-ratio: 1;
}
#eval-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  align-self: stretch;
}
.eval-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: .68rem;
  color: var(--dim);
  white-space: nowrap;
}
#eval-w { color: #e8e8e8; }
#eval-bar {
  width: 16px;
  flex: 1;
  border-radius: 4px;
  overflow: hidden;
  background: #2b2b2b;            /* black's share */
  position: relative;
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}
#eval-white {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: #f3f3f3;            /* white's share, grows from bottom */
  height: 50%;
  transition: height .45s ease;
}
#eval-mid {
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 1px;
  background: var(--gold);
  opacity: .55;
}
#board-svg {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 2px;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
#board-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: .75rem;
  color: var(--dim);
  text-align: center;
}

/* ── Side panel ── */
#panel {
  flex: 1;
  min-width: 0;
  max-width: 440px;
  background: var(--panel);
  border-left: 1px solid rgba(255,255,255,.07);
  display: flex;
  flex-direction: column;
}
#panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 22px 22px 12px;
}

.opening-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  color: var(--gold);
  margin-bottom: 6px;
}
.opening-desc {
  font-size: .88rem;
  color: var(--dim);
  font-style: italic;
  line-height: 1.55;
  margin-bottom: 18px;
}
.turn-label {
  font-size: .73rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--dim);
  margin-bottom: 10px;
}
.candidates-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.cand-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 11px;
  background: rgba(0,0,0,.22);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 6px;
  cursor: pointer;
  transition: background .13s;
}
.cand-item:hover { background: rgba(255,255,255,.07); }
.cand-badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .82rem; flex-shrink: 0; color: #fff;
}
.badge-best  { background: var(--green); }
.badge-ok    { background: var(--blue);  }
.badge-err   { background: var(--red);   }
.cand-move {
  font-family: 'JetBrains Mono', monospace;
  font-size: .88rem; font-weight: 500; color: var(--text);
}
.cand-exp { font-size: .8rem; color: var(--dim); margin-top: 2px; line-height: 1.42; }

.reply-box {
  background: rgba(0,0,0,.2);
  border-left: 3px solid var(--gold);
  padding: 9px 13px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 14px;
}
.reply-lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); margin-bottom: 3px; }
.reply-move { font-family: 'JetBrains Mono', monospace; font-size: .92rem; }
.reply-exp { font-size: .8rem; color: var(--dim); margin-top: 4px; line-height: 1.4; }

.breadcrumb {
  font-family: 'JetBrains Mono', monospace;
  font-size: .76rem;
  color: var(--dim);
  margin-bottom: 14px;
  line-height: 1.9;
}
.bc-move {
  display: inline-block;
  background: rgba(255,255,255,.08);
  padding: 1px 5px;
  border-radius: 3px;
  margin: 1px 2px;
}
.bc-move.student { color: var(--text); }

.complete-msg {
  text-align: center;
  padding: 24px 16px;
  color: var(--gold);
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  line-height: 1.6;
}
.cont-box {
  margin: 14px 0 16px;
  padding: 14px 16px;
  text-align: left;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(212,175,55,.25);
  border-radius: 6px;
  color: #d8d8d8;
  font-family: system-ui, sans-serif;
  font-size: .86rem;
  line-height: 1.55;
}
.cont-loading { color: var(--dim); font-style: italic; }

/* Explore (initial) panel */
.explore-msg {
  color: var(--dim);
  font-size: .9rem;
  line-height: 1.6;
  margin-bottom: 20px;
}
.explore-hint {
  font-size: .78rem;
  color: var(--dim);
  opacity: .7;
  line-height: 1.6;
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: .82rem;
  color: var(--dim);
}
.legend-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Panel actions ── */
#panel-actions {
  padding: 12px 22px 14px;
  border-top: 1px solid rgba(255,255,255,.07);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* ── Mistake panel ── */
#mistake-panel {
  background: rgba(192,57,43,.13);
  border-top: 2px solid #c0392b;
  padding: 14px 22px;
  display: none;
}
#mistake-panel.show { display: block; }
.mistake-hdr { font-weight: 600; color: #e74c3c; margin-bottom: 6px; font-size: .92rem; }
.mistake-body { font-size: .84rem; color: var(--dim); line-height: 1.5; margin-bottom: 10px; }

/* ── Loading overlay ── */
#loading {
  position: fixed; inset: 0;
  background: rgba(26,26,46,.92);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px; z-index: 100;
}
#loading.show { display: flex; }
.spin { font-size: 2.5rem; animation: spin 1.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--gold); }

/* ── Error toast ── */
#toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: #c0392b; color: #fff;
  padding: 14px 44px 14px 20px; border-radius: 6px;
  font-size: .88rem; display: none; z-index: 200;
  max-width: 520px; text-align: left; line-height: 1.5;
  cursor: pointer;
}
#toast.show { display: block; }

/* ── Explanation modal ── */
#explain-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.72);
  display: none; align-items: center; justify-content: center;
  z-index: 150; padding: 24px;
}
#explain-modal.show { display: flex; }
.modal-box {
  background: var(--panel);
  border: 1px solid rgba(212,175,55,.35);
  border-radius: 8px;
  padding: 24px;
  max-width: 500px; width: 100%;
}
.modal-title { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 12px; font-size: 1.05rem; }
.modal-body { font-size: .88rem; line-height: 1.65; color: var(--dim); white-space: pre-wrap; }
.modal-close { margin-top: 16px; }

/* ── Animations ── */
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.7; } }
.pulse { animation: pulse 2.4s ease-in-out infinite; }

@keyframes fadeIn { from { opacity:0; transform: scale(.85); } to { opacity:1; transform: scale(1); } }
.fadein { animation: fadeIn .18s ease-out both; }

/* ── Mobile ── */
@media (max-width: 860px) {
  #main { flex-direction: column; }
  #panel {
    max-width: 100%; flex: none;
    border-left: none; border-top: 1px solid rgba(255,255,255,.07);
  }
  #board-section { flex: none; padding: 14px 12px 10px; }
  #board-wrap { width: min(480px, calc(100vw - 92px)); }
  #panel-scroll { padding: 16px 16px 10px; }
  #panel-actions { padding: 10px 14px 12px; }
  header { padding-left: 14px; padding-right: 14px; }
}
@media (max-width: 420px) {
  #eval-bar { width: 12px; }
  .btn { padding: 7px 9px; font-size: .72rem; }
  #board-wrap { width: min(480px, calc(100vw - 80px)); }
}
</style>
</head>
<body>

<header>
  <div class="logo">♟ Chess Opening Trainer</div>
  <div class="hdr-btns">
    <button class="btn btn-gold" id="flip-btn">⟲ Flip</button>
    <button class="btn" id="key-btn">⚙ API Key</button>
  </div>
</header>

<div id="api-bar">
  <label for="api-key-input">Anthropic API Key:</label>
  <input type="password" id="api-key-input" placeholder="sk-ant-..." spellcheck="false" autocomplete="off">
  <button class="btn" id="save-key-btn">Save</button>
  <span id="key-status"></span>
</div>

<script>
// ─────────────────────────────────────────────
//  Constants
// ─────────────────────────────────────────────
const PIECES = {
  K:'♔', Q:'♕', R:'♖', B:'♗', N:'♘', P:'♙',
  k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟'
};
const SQ = 60; // viewBox px per square
const MAX_LINE_MOVES = 20; // cap on how deep "Analyze further moves" can go

// UCI rank order for first moves (by opening theory relevance)
const FIRST_MOVE_RANK = {
  'e2e4':0,'d2d4':1,'c2c4':2,'g1f3':3,
  'b1c3':4,'g2g3':5,'f2f4':6,'b2b3':7,
  'c2c3':8,'d2d3':9,'e2e3':10,'b2b4':11,
  'a2a4':12,'h2h4':13,'g2g4':14,'f2f3':15,
  'b1a3':16,'g1h3':17,'a2a3':18,'h2h3':19
};

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
const S = {
  apiKey: (() => { try { return sessionStorage.getItem('cot_key') || ''; } catch(e) { return ''; } })(),
  active: false,        // true once an opening lesson is in progress
  opening: '',
  description: '',
  perspective: 'white',
  posMem: {},     // session cache: normFen → { candidates:[], continuation:null }
  chess: new Chess(),
  history: [],    // { uci, san, quality, label, explanation, isPunishment }
  phase: 'exploring', // exploring | loading | student_turn | mistake | complete
  mistakeNode: null,
  flipped: false,
  selectedSq: null,     // square picked for a free (off-book) move
  explMoves: [],        // precomputed legal first moves
  openingMoveUci: null, // first move chosen from exploration
  openingMoveSan: null,
};

// ─────────────────────────────────────────────
//  Utilities
// ─────────────────────────────────────────────
function normFen(fen) { return fen.split(' ').slice(0, 4).join(' '); }
function clampPct(v) {
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? Math.max(2, Math.min(98, n)) : 50;
}

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, ms = 20000) {
  const el = document.getElementById('toast');
  el.innerHTML = msg.replace(/\n/g, '<br>') +
    '<span id="toast-x" style="position:absolute;top:8px;right:12px;cursor:pointer;opacity:.8;font-size:.9rem" onclick="this.parentElement.classList.remove(\'show\')"> ✕</span>';
  el.classList.add('show');
  clearTimeout(el._tid);
  el._tid = setTimeout(() => el.classList.remove('show'), ms);
}

function setLoading(on, txt = 'Consulting the grandmasters…') {
  document.getElementById('loading-txt').textContent = txt;
  document.getElementById('loading').classList.toggle('show', on);
}

function sqXY(sq, flipped) {
  const file = sq.charCodeAt(0) - 97;
  const rank = parseInt(sq[1]);
  return {
    x: (flipped ? 7 - file : file) * SQ,
    y: (flipped ? rank - 1 : 8 - rank) * SQ
  };
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function execMove(uci) {
  return S.chess.move({ from: uci.slice(0,2), to: uci.slice(2,4), promotion: uci[4] || undefined });
}

// ─────────────────────────────────────────────
//  Exploration moves (precomputed, first move candidates)
// ─────────────────────────────────────────────
function buildExplorationMoves() {
  const chess = new Chess();
  const moves = chess.moves({ verbose: true });
  const LABELS = 'ABCDabcdefghijklmnop';

  const sorted = [...moves].sort((a, b) => {
    const ai = FIRST_MOVE_RANK[a.from + a.to] ?? 99;
    const bi = FIRST_MOVE_RANK[b.from + b.to] ?? 99;
    return ai - bi;
  });

  return sorted.map((m, i) => ({
    uci: m.from + m.to,
    move: m.san,
    mover: 'white',
    quality: i < 4 ? 'best' : i < 8 ? 'ok' : 'neutral',
    label: LABELS[i] || '?',
    path: [],
    is_opponent_reply: false,
    exploration: true,
  }));
}

// ─────────────────────────────────────────────
//  Board rendering
// ─────────────────────────────────────────────
function renderBoard() {
  const svg = document.getElementById('board-svg');
  svg.innerHTML = '';
  const fl = S.flipped;

  // Squares + coordinates
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const light = (row + col) % 2 === 0;
      const x = col * SQ, y = row * SQ;

      svg.appendChild(svgEl('rect', {
        x, y, width: SQ, height: SQ,
        fill: light ? '#F0D9B5' : '#B58863'
      }));

      if (row === 7) {
        const fi = fl ? 7 - col : col;
        const t = svgEl('text', {
          x: x + SQ - 3, y: y + SQ - 3,
          'font-size': 10, 'text-anchor': 'end',
          fill: light ? '#B58863' : '#F0D9B5',
          'font-family': 'JetBrains Mono, monospace',
          'pointer-events': 'none'
        });
        t.textContent = String.fromCharCode(97 + fi);
        svg.appendChild(t);
      }
      if (col === 0) {
        const rn = fl ? row + 1 : 8 - row;
        const t = svgEl('text', {
          x: x + 3, y: y + 13, 'font-size': 10,
          fill: light ? '#B58863' : '#F0D9B5',
          'font-family': 'JetBrains Mono, monospace',
          'pointer-events': 'none'
        });
        t.textContent = rn;
        svg.appendChild(t);
      }
    }
  }

  // Last-move highlight
  if (S.history.length > 0) {
    const last = S.history[S.history.length - 1];
    if (last?.uci?.length >= 4) {
      for (const sq of [last.uci.slice(0,2), last.uci.slice(2,4)]) {
        const {x, y} = sqXY(sq, fl);
        svg.appendChild(svgEl('rect', {
          x, y, width: SQ, height: SQ,
          fill: 'rgba(246,246,105,.38)'
        }));
      }
    }
  }

  // Pieces
  const board = S.chess.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const pc = board[r][c];
      if (!pc) continue;
      const sq = String.fromCharCode(97 + c) + (8 - r);
      const {x, y} = sqXY(sq, fl);
      const cx = x + SQ / 2, cy = y + SQ / 2;
      const glyph = pc.color === 'w' ? PIECES[pc.type.toUpperCase()] : PIECES[pc.type];
      const isW = pc.color === 'w';

      const pcId = 'pc-' + pc.color + pc.type.toUpperCase();
      const useEl = svgEl('use', { href: '#' + pcId, x, y, width: SQ, height: SQ });
      svg.appendChild(useEl);
    }
  }

  // Overlays
  if (S.phase === 'exploring') {
    renderExplorationOverlays(S.explMoves, svg, fl);
  } else if (S.phase === 'student_turn') {
    // Selected-piece highlight for a free off-book move.
    if (S.selectedSq) {
      const {x, y} = sqXY(S.selectedSq, fl);
      svg.appendChild(svgEl('rect', {
        x, y, width: SQ, height: SQ, fill: 'rgba(246,246,105,.45)'
      }));
    }
    // Transparent click layer on every square so the player can play any
    // legal move (off book) — added BEFORE the arrows so candidate arrows
    // stay clickable on top of it.
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const sq = String.fromCharCode(97 + c) + (8 - r);
        const {x, y} = sqXY(sq, fl);
        const hit = svgEl('rect', {
          x, y, width: SQ, height: SQ, fill: 'transparent'
        });
        hit.style.cursor = 'pointer';
        hit.addEventListener('click', () => handleBoardSquareClick(sq));
        svg.appendChild(hit);
      }
    }
    const pos = getPos(S.chess.fen());
    if (pos?.candidates?.length) renderTrainingOverlays(pos.candidates, svg, fl);
  }

  // Board label
  const lbl = document.getElementById('board-label');
  if (S.active) {
    lbl.textContent = S.opening;
  } else {
    lbl.textContent = 'Click any move to begin';
  }

  renderEvalBar();
}

// Win-probability bar (estimate from the API for the current position).
function renderEvalBar() {
  let pct = 50;
  if (S.active && S.phase !== 'loading') {
    const d = getPos(S.chess.fen());
    if (d && Number.isFinite(d.whitePct)) pct = d.whitePct;
  }
  const wEl = document.getElementById('eval-white');
  if (wEl) wEl.style.height = pct + '%';
  const w = document.getElementById('eval-w');
  const b = document.getElementById('eval-b');
  if (w) w.textContent = 'W ' + pct + '%';
  if (b) b.textContent = 'B ' + (100 - pct) + '%';
}

// ── Exploration overlays: all 20 first moves, grouped by destination ──
function renderExplorationOverlays(moves, svg, fl) {
  // Group by destination square (handle collisions)
  const byDest = new Map();
  for (const m of moves) {
    const to = m.uci.slice(2, 4);
    if (!byDest.has(to)) byDest.set(to, []);
    byDest.get(to).push(m);
  }

  for (const [to, group] of byDest) {
    const {x, y} = sqXY(to, fl);
    const sqCx = x + SQ / 2, sqCy = y + SQ / 2;

    if (group.length === 1) {
      appendExploreCircle(group[0], sqCx, sqCy, 15, svg);
    } else {
      // Two moves to same square (e.g., Na3 and a3): symmetric pair.
      // Put the knight's badge on the side nearer the knight and draw a
      // thin connector line so it's clear which move is the knight's.
      const isKnightMv = m => {
        const df = Math.abs(m.uci.charCodeAt(2) - m.uci.charCodeAt(0));
        const dr = Math.abs(parseInt(m.uci[3]) - parseInt(m.uci[1]));
        return (df === 1 && dr === 2) || (df === 2 && dr === 1);
      };
      const kIdx = group.findIndex(isKnightMv);

      if (kIdx === -1) {
        appendExploreCircle(group[0], sqCx - 14, sqCy, 12, svg);
        appendExploreCircle(group[1], sqCx + 14, sqCy, 12, svg);
      } else {
        const kMove = group[kIdx];
        const oMove = group[1 - kIdx];
        const ks = sqXY(kMove.uci.slice(0, 2), fl);
        const ksx = ks.x + SQ / 2, ksy = ks.y + SQ / 2;
        // Side closest to the knight's own square.
        const kLeft = ksx < sqCx;
        const kx = sqCx + (kLeft ? -14 : 14);
        const ox = sqCx + (kLeft ?  14 : -14);

        // L-shaped connector: sideways from the knight first, then up to
        // its badge — keeps the line off the knight and other pieces.
        // Insert behind the pieces (before the first piece <use>).
        const connector = svgEl('polyline', {
          points: `${ksx},${ksy} ${kx},${ksy} ${kx},${sqCy}`,
          fill: 'none', stroke: exploreColor(kMove.quality),
          'stroke-width': 1.5, 'stroke-linejoin': 'round',
          opacity: 0.5, 'pointer-events': 'none'
        });
        const firstPiece = svg.querySelector('use[href^="#pc-"]');
        if (firstPiece) svg.insertBefore(connector, firstPiece);
        else svg.appendChild(connector);
        appendExploreCircle(oMove, ox, sqCy, 12, svg);
        appendExploreCircle(kMove, kx, sqCy, 12, svg);
      }
    }
  }
}

// Exploration quality → badge colour (mirrors the in-app candidate badges).
function exploreColor(q) {
  return q === 'best' ? '#27ae60' : q === 'ok' ? '#2980b9' : '#a08c5a';
}

function appendExploreCircle(m, cx, cy, r, svg) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.classList.add('fadein');
  g.style.cursor = 'pointer';
  const color = exploreColor(m.quality);

  g.appendChild(svgEl('circle', {
    cx, cy, r,
    fill: color, stroke: '#fff', 'stroke-width': 2
  }));
  const lbl = svgEl('text', {
    x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-size': Math.round(r * 1.2), 'font-weight': 700,
    'font-family': 'JetBrains Mono, monospace',
    fill: '#fff', 'pointer-events': 'none'
  });
  lbl.textContent = m.label;
  g.appendChild(lbl);
  g.addEventListener('click', () => handleExplorationClick(m));
  svg.appendChild(g);
}

// ── Training overlays: quality-labeled candidate moves ──
// Quality → arrow/badge colour (matches the panel badges).
function qualColor(q) {
  return q === 'best' ? '#27ae60' : q === 'ok' ? '#2980b9' : '#c0392b';
}

function renderTrainingOverlays(candidates, svg, fl) {
  // First compute the geometry of every arrow…
  const arrows = candidates.map((cand, i) => {
    const from = cand.uci.slice(0, 2);
    const to = cand.uci.slice(2, 4);
    const f = sqXY(from, fl), t = sqXY(to, fl);
    const fx = f.x + SQ / 2, fy = f.y + SQ / 2;
    const tx = t.x + SQ / 2, ty = t.y + SQ / 2;

    // Knight move? (file/rank deltas of {1,2}) → L-shaped arrow:
    // long (2-square) leg first, then a 90° bend for the short leg.
    const dfile = to.charCodeAt(0) - from.charCodeAt(0);
    const drank = parseInt(to[1]) - parseInt(from[1]);
    const isKnight = (Math.abs(dfile) === 1 && Math.abs(drank) === 2) ||
                     (Math.abs(dfile) === 2 && Math.abs(drank) === 1);

    const pts = [{ x: fx, y: fy }];
    if (isKnight) {
      const cornerSq = (Math.abs(dfile) === 2)
        ? to[0] + from[1]
        : from[0] + to[1];
      const c = sqXY(cornerSq, fl);
      pts.push({ x: c.x + SQ / 2, y: c.y + SQ / 2 });
    }
    pts.push({ x: tx, y: ty });

    const a = pts[0], b = pts[1];
    let d0x = b.x - a.x, d0y = b.y - a.y;
    const l0 = Math.hypot(d0x, d0y) || 1; d0x /= l0; d0y /= l0;
    const lastP = pts[pts.length - 1], prevP = pts[pts.length - 2];
    let dnx = lastP.x - prevP.x, dny = lastP.y - prevP.y;
    const ln = Math.hypot(dnx, dny) || 1; dnx /= ln; dny /= ln;
    const px = -dny, py = dnx;

    const p1 = { x: a.x + d0x * SQ * 0.34, y: a.y + d0y * SQ * 0.34 };
    const tip = { x: lastP.x - dnx * SQ * 0.20, y: lastP.y - dny * SQ * 0.20 };
    const headLen = 17, headW = 12;
    const base = { x: tip.x - dnx * headLen, y: tip.y - dny * headLen };

    // Total travelled length — longer arrows are drawn first (underneath).
    let pathLen = 0;
    for (let j = 1; j < pts.length; j++)
      pathLen += Math.hypot(pts[j].x - pts[j-1].x, pts[j].y - pts[j-1].y);

    return { cand, i, from, pts, p1, tip, base, px, py, headW,
             color: qualColor(cand.quality), pathLen };
  });

  // Point at a fraction (0..1) of the cumulative shaft path, so a badge
  // always sits ON its own arrow even after we slide it to dodge others.
  const ptAt = (shaft, frac) => {
    const segs = []; let total = 0;
    for (let j = 1; j < shaft.length; j++) {
      const L = Math.hypot(shaft[j].x - shaft[j-1].x, shaft[j].y - shaft[j-1].y);
      segs.push(L); total += L;
    }
    let target = Math.max(0, Math.min(1, frac)) * total;
    for (let j = 1; j < shaft.length; j++) {
      const L = segs[j-1];
      if (target <= L || j === shaft.length - 1) {
        const r = L ? target / L : 0;
        return { x: shaft[j-1].x + (shaft[j].x - shaft[j-1].x) * r,
                 y: shaft[j-1].y + (shaft[j].y - shaft[j-1].y) * r };
      }
      target -= L;
    }
    return shaft[shaft.length - 1];
  };

  arrows.forEach(ar => { ar.shaft = [ar.p1, ...ar.pts.slice(1, -1), ar.base]; });

  // Initial badge fraction: spread arrows sharing a source square so the
  // collinear pawn one/two-square case starts already separated.
  const groups = {};
  arrows.forEach(ar => (groups[ar.from] = groups[ar.from] || []).push(ar));
  Object.values(groups).forEach(grp => {
    grp.sort((x, y) => x.pathLen - y.pathLen);
    grp.forEach((ar, k) => {
      ar.t = grp.length === 1 ? 0.44 : Math.min(0.22 + k * 0.20, 0.72);
    });
  });

  // Collision relaxation: nudge any badges that are too close apart by
  // sliding them along their own shafts (different sources included).
  const MIN = 31;
  for (let pass = 0; pass < 26; pass++) {
    arrows.forEach(ar => (ar.badge = ptAt(ar.shaft, ar.t)));
    let moved = false;
    for (let x = 0; x < arrows.length; x++) {
      for (let y = x + 1; y < arrows.length; y++) {
        const A = arrows[x], B = arrows[y];
        const dist = Math.hypot(A.badge.x - B.badge.x, A.badge.y - B.badge.y);
        if (dist >= MIN) continue;
        moved = true;
        // Shorter arrow drifts toward its source, longer toward its target.
        const aShort = A.pathLen <= B.pathLen;
        A.t = Math.max(0.16, Math.min(0.78, A.t + (aShort ? -0.05 : 0.05)));
        B.t = Math.max(0.16, Math.min(0.78, B.t + (aShort ?  0.05 : -0.05)));
      }
    }
    if (!moved) break;
  }
  arrows.forEach(ar => (ar.badge = ptAt(ar.shaft, ar.t)));

  // Pass 1 — shafts + arrowheads, longest first so shorter ones sit on top.
  [...arrows].sort((x, y) => y.pathLen - x.pathLen).forEach(ar => {
    const shaft = [ar.p1, ...ar.pts.slice(1, -1), ar.base];
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('fadein');
    g.style.animationDelay = `${ar.i * 0.1}s`;
    g.appendChild(svgEl('polyline', {
      points: shaft.map(p => `${p.x},${p.y}`).join(' '),
      fill: 'none', stroke: ar.color,
      'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      opacity: 0.72, 'pointer-events': 'none'
    }));
    g.appendChild(svgEl('polygon', {
      points: `${ar.tip.x},${ar.tip.y} ${ar.base.x + ar.px*ar.headW},${ar.base.y + ar.py*ar.headW} ${ar.base.x - ar.px*ar.headW},${ar.base.y - ar.py*ar.headW}`,
      fill: ar.color, opacity: 0.72, 'pointer-events': 'none'
    }));
    svg.appendChild(g);
  });

  // Pass 2 — badges + letters on top of EVERY arrow, always visible/clickable.
  arrows.forEach(ar => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('fadein');
    g.style.animationDelay = `${ar.i * 0.1}s`;
    g.style.cursor = 'pointer';

    // Invisible hit area following the whole path.
    g.appendChild(svgEl('polyline', {
      points: [ar.p1, ...ar.pts.slice(1, -1), ar.tip].map(p => `${p.x},${p.y}`).join(' '),
      fill: 'none', stroke: 'transparent', 'stroke-width': 26
    }));
    g.appendChild(svgEl('circle', {
      cx: ar.badge.x, cy: ar.badge.y, r: 14,
      fill: ar.color, stroke: '#fff', 'stroke-width': 2
    }));
    const lbl = svgEl('text', {
      x: ar.badge.x, y: ar.badge.y, 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': 17, 'font-weight': 700,
      'font-family': 'JetBrains Mono, monospace',
      fill: '#fff', 'pointer-events': 'none'
    });
    lbl.textContent = ar.cand.label;
    g.appendChild(lbl);

    g.addEventListener('click', () => handleCandidateClick(ar.cand));
    svg.appendChild(g);
  });
}

function getPieceAt(sq, chess) {
  const col = sq.charCodeAt(0) - 97;
  const row = 8 - parseInt(sq[1]);
  return chess.board()[row]?.[col] || null;
}

// ─────────────────────────────────────────────
//  Per-position cache (lazy, incremental). Keyed by normalised FEN so
//  transpositions are reused across openings. Backed by localStorage,
//  which throws in sandboxed iframes — hence the try/catch.
// ─────────────────────────────────────────────
function posKey(fen) { return 'cot_pos_' + normFen(fen); }

function getPos(fen) {
  const k = normFen(fen);
  if (S.posMem[k]) return S.posMem[k];
  try {
    const raw = localStorage.getItem(posKey(fen));
    if (raw) { const d = JSON.parse(raw); S.posMem[k] = d; return d; }
  } catch (e) {}
  return null;
}
function putPos(fen, data) {
  S.posMem[normFen(fen)] = data;
  try { localStorage.setItem(posKey(fen), JSON.stringify(data)); } catch (e) {}
}
function deletePos(fen) {
  delete S.posMem[normFen(fen)];
  try { localStorage.removeItem(posKey(fen)); } catch (e) {}
}

function cachedOpeningMeta(uci) {
  try { const r = localStorage.getItem('cot_open_' + uci); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function saveOpeningMeta(uci, m) {
  try { localStorage.setItem('cot_open_' + uci, JSON.stringify(m)); } catch (e) {}
}

// Move list so far, e.g. "1.d4 d5 2.c4" — context for the model.
function sanLine() {
  return S.history
    .map((h, i) => (i % 2 === 0 ? (Math.floor(i / 2) + 1) + '.' : '') + h.san)
    .join(' ');
}

// Keep only candidate moves that are actually legal in this position.
function validateCandidates(fen, cands) {
  const out = [];
  for (const c of (cands || [])) {
    if (!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(c.uci || '')) {
      console.warn('Bad uci dropped:', c.uci); continue;
    }
    const t = new Chess(fen);
    if (!t.move({ from: c.uci.slice(0,2), to: c.uci.slice(2,4), promotion: c.uci[4] })) {
      console.warn('Illegal candidate dropped:', c.uci, 'at', fen); continue;
    }
    if (!out.find(x => x.uci === c.uci)) out.push(c);
  }
  return out;
}

// ─────────────────────────────────────────────
//  API
// ─────────────────────────────────────────────
async function apiFetch(content, max_tokens = 3200) {
  if (!S.apiKey) throw new Error('No API key set — click ⚙ API Key and save your key first.');

  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': S.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens, messages: [{ role: 'user', content }] })
    });
  } catch (netErr) {
    throw new Error('Network error — check your connection. (' + netErr.message + ')');
  }

  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try { const e = await res.json(); detail = e.error?.message || detail; } catch {}
    throw new Error(detail);
  }

  const data = await res.json();
  return data.content.map(b => b.text || '').join('');
}

function extractJSON(text) {
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) return JSON.parse(fence[1].trim());
  const obj = text.match(/\{[\s\S]*\}/);
  if (obj) return JSON.parse(obj[0]);
  return JSON.parse(text);
}

// Fetch candidate moves for ONE position only. Small, fast, never truncates.
// isFirst=true also asks the model to identify the opening (name/desc/orientation).
async function fetchPosition(fen, line, isFirst, force) {
  const turn = fen.split(' ')[1] === 'w' ? 'White' : 'Black';
  const metaSchema = isFirst
    ? '"opening":"string","perspective":"white|black","description":"≤40 words",' : '';
  const prompt =
`Chess opening trainer — analyse ONE position only.
Moves so far: ${line || '(none — starting position)'}
Current FEN: ${fen}
${turn} to move.
${isFirst
  ? 'Identify the opening that best fits this first move and is most instructive to study, then give the principled replies here.'
  : 'Continue the established opening theory for this exact position.'}
Respond ONLY with a valid, COMPLETE JSON object (no markdown, no backticks):
{${metaSchema}"whiteWinPct":50,"candidates":[{"move":"SAN","uci":"e2e4","quality":"best|ok|mistake","label":"A","explanation":"≤14 words","punishment":null,"punishment_move":null,"punishment_move_uci":null}],"continuation":null}
"whiteWinPct": integer 0-100 — White's practical winning chances in THIS position with best play (50 = balanced, >50 favours White, <50 favours Black).
${force
  ? `Opening theory has ended, but the player wants to keep going. ALWAYS return 2-4 strong practical candidate moves for ${turn} here (middlegame/typical-plan moves are fine). Set "continuation":null.`
  : `Give 2-4 theory candidate moves for ${turn} in THIS position only.`} Each "uci" MUST be a legal ${turn} move (from+to lowercase, e.g. "e2e4"; promotion "e7e8q").
quality/label: best→A/B/C, ok→a/b/c, mistake→x/y/z. For a mistake also fill "punishment" (≤20 words why it's bad), "punishment_move" (SAN of the refutation), "punishment_move_uci".
${force
  ? 'Do NOT end the line — "candidates" must be non-empty.'
  : 'If opening theory has essentially ended here, return "candidates":[] and set "continuation" to 2-3 sentences (≤45 words) on the resulting middlegame plans for BOTH sides. Otherwise "continuation":null.'}`;

  const text = await apiFetch(prompt, 1500);
  try {
    return extractJSON(text);
  } catch (parseErr) {
    console.warn('JSON parse failed, raw:', text.slice(0, 600));
    const retry = await apiFetch(
      'Reply with ONLY a complete, valid JSON object, all brackets closed. ' + prompt, 1500);
    return extractJSON(retry);
  }
}


async function fetchExplanation(opening, lastMove, fen) {
  return apiFetch(
`In the ${opening}, after ${lastMove} (FEN: ${fen}), give a deeper explanation:
- Key ideas and threats for both sides
- Plans each side should pursue
- Tactical motifs to watch for
Under 150 words, for an improving club player.`, 600
  );
}

// ─────────────────────────────────────────────
//  Game flow
// ─────────────────────────────────────────────

// First move clicked on exploration board
async function handleExplorationClick(node) {
  if (!S.apiKey) { toast('Enter your Anthropic API key first (⚙ API Key).'); return; }
  if (S.phase !== 'exploring') return;

  // Play the move immediately for visual feedback
  const result = execMove(node.uci);
  if (!result) { toast('Invalid move: ' + node.uci); return; }

  S.openingMoveUci = node.uci;
  S.openingMoveSan = result.san;
  S.history = [{
    uci: node.uci, san: result.san,
    quality: 'best', label: node.label,
    explanation: `Opening move: 1.${result.san}`,
    isPunishment: false
  }];
  S.mistakeNode = null;

  const fen = S.chess.fen();
  const meta = cachedOpeningMeta(node.uci);

  // Restore opening identity from cache, or fetch it with this first position.
  if (meta && getPos(fen)) {
    S.opening = meta.opening;
    S.description = meta.description;
    S.perspective = meta.perspective;
    S.active = true;
    document.getElementById('panel-actions').style.display = 'flex';
    document.getElementById('mistake-panel').classList.remove('show');
    await advance();
    return;
  }

  S.phase = 'loading';
  setLoading(true, `Analysing 1.${result.san}…`);
  renderBoard(); updatePanel();

  try {
    const raw = await fetchPosition(fen, sanLine(), true);
    S.opening = raw.opening || `1.${result.san} Opening`;
    S.description = raw.description || '';
    S.perspective = (raw.perspective === 'black') ? 'black' : 'white';
    saveOpeningMeta(node.uci, {
      opening: S.opening, description: S.description, perspective: S.perspective
    });
    putPos(fen, {
      candidates: validateCandidates(fen, raw.candidates),
      continuation: raw.continuation || null,
      whitePct: clampPct(raw.whiteWinPct)
    });
    S.active = true;
    setLoading(false);
    document.getElementById('panel-actions').style.display = 'flex';
    document.getElementById('mistake-panel').classList.remove('show');
    await advance();
  } catch (err) {
    S.chess.undo();
    S.history = [];
    S.phase = 'exploring';
    setLoading(false);
    renderBoard(); updatePanel();
    toast('Error: ' + (err.message || String(err)) +
      '\n\n(Check browser console for details — open DevTools with ⌥⌘I)');
    console.error('fetchPosition failed:', err);
  }
}

// Auto-expand: show candidates for the current position, fetching them
// lazily (and caching) only if this exact position hasn't been analysed yet.
async function advance() {
  S.selectedSq = null;
  const fen = S.chess.fen();
  let data = getPos(fen);

  if (!data) {
    S.phase = 'loading';
    setLoading(true, 'Analysing next move…');
    renderBoard(); updatePanel();
    try {
      const raw = await fetchPosition(fen, sanLine(), false);
      data = {
        candidates: validateCandidates(fen, raw.candidates),
        continuation: raw.continuation || null,
        whitePct: clampPct(raw.whiteWinPct)
      };
      putPos(fen, data);
    } catch (err) {
      setLoading(false);
      // Stay on the last move; the user can step Back or try again.
      S.phase = 'complete';
      updatePanel(); renderBoard();
      toast('Could not analyse this position: ' + (err.message || String(err)));
      console.error('advance fetch failed:', err);
      return;
    }
    setLoading(false);
  }

  if (data.candidates.length) {
    S.phase = 'student_turn';
  } else {
    S.phase = 'complete';
    ensureContinuation(fen, data);
  }
  updatePanel(); renderBoard();
}

// Make sure a completed line always has written guidance; fetch if missing.
function ensureContinuation(fen, data) {
  if (data.continuation || S._contFetching) return;
  S._contFetching = true;
  const lastSan = S.history.length ? S.history[S.history.length - 1].san : 'the opening';
  fetchExplanation(S.opening, lastSan, fen)
    .then(txt => { data.continuation = txt.trim(); putPos(fen, data); })
    .catch(() => { data.continuation = 'Could not load further guidance — check your connection and step Back to try again.'; })
    .finally(() => {
      S._contFetching = false;
      if (S.phase === 'complete' && normFen(S.chess.fen()) === normFen(fen)) {
        const box = document.getElementById('cont-box');
        if (box && data.continuation) box.textContent = data.continuation;
      }
    });
}

async function handleCandidateClick(node) {
  if (S.phase !== 'student_turn') return;

  const result = execMove(node.uci);
  if (!result) { toast('Move failed: ' + node.uci); return; }

  S.history.push({
    uci: node.uci, san: result.san,
    quality: node.quality, label: node.label,
    explanation: node.explanation || '',
    isPunishment: false
  });
  renderBoard();

  if (node.quality === 'mistake') {
    S.phase = 'mistake';
    S.mistakeNode = node;
    document.getElementById('mistake-body').textContent =
      node.punishment || 'This move has significant problems.';
    document.getElementById('mistake-panel').classList.add('show');
    updatePanel();
  } else {
    document.getElementById('mistake-panel').classList.remove('show');
    S.mistakeNode = null;
    updatePanel();
    await advance();
  }
}

// Play any legal move by clicking the board directly (off book) — lets the
// player deviate and see the resulting variation, as if making a mistake.
async function playOffBook(from, to) {
  const res = S.chess.move({ from, to, promotion: 'q' });
  if (!res) return false;
  S.selectedSq = null;
  S.history.push({
    uci: from + to + (res.promotion || ''), san: res.san,
    quality: 'offbook', label: null,
    explanation: 'Off-book move — exploring this line.',
    isPunishment: false
  });
  document.getElementById('mistake-panel').classList.remove('show');
  S.mistakeNode = null;
  renderBoard(); updatePanel();
  await advance();
  return true;
}

function handleBoardSquareClick(sq) {
  if (S.phase !== 'student_turn') return;
  const turn = S.chess.turn();
  const pieceHere = S.chess.get(sq);
  const mine = pieceHere && pieceHere.color === turn;

  // A piece is already selected → try to move it to the clicked square.
  if (S.selectedSq) {
    if (sq === S.selectedSq) { S.selectedSq = null; renderBoard(); return; }
    const legal = S.chess.moves({ square: S.selectedSq, verbose: true })
      .some(m => m.to === sq);
    if (legal) { playOffBook(S.selectedSq, sq); return; }
    // Not legal: switch selection to another own piece, or clear.
    S.selectedSq = mine ? sq : null;
    renderBoard();
    return;
  }

  // No selection yet.
  const movesTo = S.chess.moves({ verbose: true }).filter(m => m.to === sq);
  if (movesTo.length === 1) { playOffBook(movesTo[0].from, sq); return; }
  if (mine) { S.selectedSq = sq; renderBoard(); return; } // pick this piece
  if (movesTo.length > 1) { playOffBook(movesTo[0].from, sq); return; } // ambiguous target → first mover
}

async function playPunishment() {
  const node = S.mistakeNode;
  if (!node?.punishment_move_uci) { toast('No punishment move available.'); return; }

  document.getElementById('mistake-panel').classList.remove('show');
  await delay(350);

  const result = execMove(node.punishment_move_uci);
  if (!result) { toast('Invalid punishment move.'); return; }

  S.history.push({
    uci: node.punishment_move_uci, san: result.san,
    quality: 'best', label: null,
    explanation: node.punishment || '',
    isPunishment: true
  });
  S.phase = 'complete';
  S.mistakeNode = null;
  renderBoard(); updatePanel();
}

// Every move is interactive now, so "back" is simply one move.
function navigateBack() {
  if (!S.history.length) return;
  document.getElementById('mistake-panel').classList.remove('show');
  S.mistakeNode = null;

  S.chess.undo();
  S.history.pop();

  if (!S.history.length) {
    // Stepped back past the first move → return to exploration.
    backToExploration();
    return;
  }
  // Restore the previous position from cache ONLY — never re-analyse on Back.
  S.selectedSq = null;
  const data = getPos(S.chess.fen());
  S.phase = (data && data.candidates.length) ? 'student_turn' : 'complete';
  updatePanel();
  renderBoard();
}

// Force-fetch moves for a position the model marked "end of theory".
async function analyzeFurther() {
  if (!S.active) return;
  if (Math.ceil(S.history.length / 2) >= MAX_LINE_MOVES) {
    toast(`Reached the ${MAX_LINE_MOVES}-move analysis limit for this line.`);
    return;
  }
  const fen = S.chess.fen();
  S.phase = 'loading';
  setLoading(true, 'Analysing further moves…');
  renderBoard(); updatePanel();
  try {
    const raw = await fetchPosition(fen, sanLine(), false, true);
    const data = {
      candidates: validateCandidates(fen, raw.candidates),
      continuation: null,
      whitePct: clampPct(raw.whiteWinPct)
    };
    putPos(fen, data);
    setLoading(false);
    S.phase = data.candidates.length ? 'student_turn' : 'complete';
    updatePanel(); renderBoard();
  } catch (err) {
    setLoading(false);
    S.phase = 'complete';
    updatePanel(); renderBoard();
    toast('Could not analyse further: ' + (err.message || String(err)));
    console.error('analyzeFurther failed:', err);
  }
}

function backToExploration() {
  S.chess = new Chess();
  S.history = [];
  S.selectedSq = null;
  S.phase = 'exploring';
  S.active = false;
  S.opening = '';
  S.description = '';
  S.openingMoveUci = null;
  S.openingMoveSan = null;
  S.mistakeNode = null;
  document.getElementById('panel-actions').style.display = 'none';
  document.getElementById('mistake-panel').classList.remove('show');
  updatePanel(); renderBoard();
}

function restartOpening() {
  if (!S.active || !S.openingMoveUci) { backToExploration(); return; }
  S.chess = new Chess();
  S.mistakeNode = null;
  document.getElementById('mistake-panel').classList.remove('show');
  const r = S.chess.move({ from: S.openingMoveUci.slice(0,2), to: S.openingMoveUci.slice(2,4), promotion: S.openingMoveUci[4] });
  S.history = r ? [{
    uci: S.openingMoveUci, san: r.san,
    quality: 'best', label: '—',
    explanation: `Opening move: 1.${r.san}`,
    isPunishment: false
  }] : [];
  advance();
}


// ─────────────────────────────────────────────
//  Panel UI
// ─────────────────────────────────────────────
function updatePanel() {
  const el = document.getElementById('panel-body');

  if (S.phase === 'exploring' || !S.active) {
    el.innerHTML = `
      <div style="margin-bottom:18px">
        <div style="font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);margin-bottom:8px">Choose your first move</div>
        <p class="explore-msg">Every lettered square on the board is a legal opening move. Click one to start — the trainer identifies the opening and teaches the theory one move at a time.</p>
      </div>
      <div style="margin-bottom:6px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)">Move quality</div>
      <div class="legend-row"><div class="legend-dot" style="background:#27ae60"></div>A – D &nbsp;Main opening moves</div>
      <div class="legend-row"><div class="legend-dot" style="background:#2980b9"></div>a – d &nbsp;Less common but sound</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(160,140,90,.8)"></div>e – t &nbsp;Unusual or passive</div>
    `;
    return;
  }

  // Breadcrumb
  let bcHTML = '';
  if (S.history.length) {
    bcHTML = '<div class="breadcrumb">';
    S.history.forEach((h, i) => {
      const num = Math.floor(i / 2) + 1;
      const isWM = i % 2 === 0;
      const prefix = isWM ? `${num}.` : '';
      const cls = h.isPunishment ? 'bc-move' : 'bc-move student';
      bcHTML += `<span class="${cls}">${esc(prefix + h.san)}</span> `;
    });
    bcHTML += '</div>';
  }

  const pos = getPos(S.chess.fen());
  let body = '';

  if (S.phase === 'complete') {
    const cont = pos?.continuation;
    const atLimit = Math.ceil(S.history.length / 2) >= MAX_LINE_MOVES;
    const furtherCtrl = atLimit
      ? `<div style="margin:4px 0 12px;color:var(--dim);font-size:.82rem">Reached the ${MAX_LINE_MOVES}-move analysis limit for this line.</div>`
      : `<button class="btn btn-gold" id="analyze-further-btn" style="margin:4px 0 12px">▸ Analyze further moves</button>`;
    body = `<div class="complete-msg">End of theory — how the game continues:
      <div id="cont-box" class="cont-box">${cont ? esc(cont) : '<span class="cont-loading">Working out the plans for this position…</span>'}</div>
      ${furtherCtrl}
      <div><small style="color:var(--dim);font-size:.82rem">Or use ← Back, ↻ Restart opening, ⌂ All moves to explore other branches.</small></div>
    </div>`;
  } else if (S.phase === 'student_turn' && pos?.candidates?.length) {
    const turnWord = S.chess.turn() === 'w' ? 'White' : 'Black';
    const moveNo = Math.ceil((S.chess.history().length + 1) / 2);
    body += `<div class="turn-label">Move ${moveNo} — Your turn (${turnWord})</div>`;
    body += '<div class="candidates-list">';
    for (const c of pos.candidates) {
      const bc = c.quality === 'best' ? 'badge-best' : c.quality === 'ok' ? 'badge-ok' : 'badge-err';
      body += `<div class="cand-item" data-uci="${esc(c.uci)}">
        <div class="cand-badge ${bc}">${esc(c.label)}</div>
        <div>
          <div class="cand-move">${esc(c.move)}</div>
          <div class="cand-exp">${esc(c.explanation)}</div>
        </div>
      </div>`;
    }
    body += '</div>';
  } else {
    const last = S.history[S.history.length - 1];
    if (last) {
      const lbl = last.isPunishment ? 'Punishment' : 'You played';
      body += `<div class="reply-box">
        <div class="reply-lbl">${lbl}</div>
        <div class="reply-move">${esc(last.san)}</div>
        ${last.explanation ? `<div class="reply-exp">${esc(last.explanation)}</div>` : ''}
      </div>`;
    }
  }

  el.innerHTML = `
    <div class="opening-title">${esc(S.opening)}</div>
    <div class="opening-desc">${esc(S.description || '')}</div>
    ${bcHTML}${body}
  `;

  // Wire panel candidate clicks
  el.querySelectorAll('.cand-item').forEach(item => {
    item.addEventListener('click', () => {
      const posNow = getPos(S.chess.fen());
      const node = posNow?.candidates?.find(c => c.uci === item.dataset.uci);
      if (node) handleCandidateClick(node);
    });
  });

  const afBtn = document.getElementById('analyze-further-btn');
  if (afBtn) afBtn.addEventListener('click', analyzeFurther);
}

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
function updateKeyStatus() {
  const el = document.getElementById('key-status');
  el.textContent = S.apiKey ? '✓ Saved for session' : 'No key set';
  el.style.color = S.apiKey ? '#27ae60' : '#c0392b';
}

function init() {
  S.explMoves = buildExplorationMoves();

  // API key
  document.getElementById('api-key-input').value = S.apiKey;
  updateKeyStatus();
  if (S.apiKey) document.getElementById('api-bar').style.display = 'none';

  document.getElementById('save-key-btn').addEventListener('click', () => {
    S.apiKey = document.getElementById('api-key-input').value.trim();
    try { sessionStorage.setItem('cot_key', S.apiKey); } catch(e) {}
    updateKeyStatus();
  });
  document.getElementById('api-key-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('save-key-btn').click();
  });
  document.getElementById('key-btn').addEventListener('click', () => {
    const bar = document.getElementById('api-bar');
    bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
  });

  // Board flip
  document.getElementById('flip-btn').addEventListener('click', () => {
    S.flipped = !S.flipped;
    renderBoard();
  });

  // Navigation
  document.getElementById('back-btn').addEventListener('click', navigateBack);
  document.getElementById('restart-btn').addEventListener('click', restartOpening);
  document.getElementById('explore-btn').addEventListener('click', backToExploration);
  document.getElementById('punish-btn').addEventListener('click', playPunishment);

  // Explain position
  document.getElementById('explain-btn').addEventListener('click', async () => {
    if (!S.active) return;
    const modal = document.getElementById('explain-modal');
    modal.classList.add('show');
    document.getElementById('modal-body').textContent = 'Loading…';
    try {
      const last = S.history.length ? S.history[S.history.length - 1].san : 'the starting position';
      const text = await fetchExplanation(S.opening, last, S.chess.fen());
      document.getElementById('modal-body').textContent = text;
    } catch {
      document.getElementById('modal-body').textContent = 'Unable to fetch explanation.';
    }
  });
  document.getElementById('modal-close-btn').addEventListener('click', () => {
    document.getElementById('explain-modal').classList.remove('show');
  });
  document.getElementById('explain-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('explain-modal'))
      document.getElementById('explain-modal').classList.remove('show');
  });

  updatePanel();
  renderBoard();
}

init();
</script>

</html>
